# ─────────────────────────────────────────────────────────────────────────────
# workspace.config.local.yaml — PERSONAL, non-shared overrides (the workspace-config
# analogue of .claude/settings.local.json).
#
# Copy this to `workspace.config.local.yaml` (git-ignored — it never travels to teammates)
# and set ONLY the keys you want to override. Anything you omit falls through to the shared
# `workspace.config.yaml`. This is a shallow per-top-level-key merge: a key you set here
# replaces that key from the shared file.
#
# PRECEDENCE — where an override actually takes effect:
#   • Everything read at RUNTIME honors it: this CLI chat (the main session), the agents
#     (they read it before producing output), and interactive skills.
#   • The committed workflow CONFIG mirror (.claude/workflows/{dev-cycle,prd}.js) is
#     generated from `workspace.config.yaml` ONLY — a local override NEVER rewrites that
#     tracked file (that is the whole point: no personal pref leaks into git). So a headless
#     workflow's own control-flow (auto_merge, auto_approve, statuses, REPOS, …) follows the
#     SHARED value. The exceptions that still work headlessly are the personal OUTPUT
#     preferences — `language` and `planning.to_html`: `dev-cycle.js` runs a dedicated
#     resolver sub-agent (`resolve-runtime-config`) as its first step that reads THIS file
#     local-first at runtime, and bakes the result into every downstream prompt — so the
#     baked const is only the fallback default. Control flow is deliberately NOT in that
#     set: `auto_approve`, `auto_merge`, statuses and REPOS decide what the pipeline DOES,
#     and a personal pref must never change that for a shared run.
#
# The realistic use for this file is a personal preference like output language:
#
# COPY THE KEYS, NOT THE COMMENTS. This template is the documentation; the live
# `workspace.config.local.yaml` carries NO comments at all — same rule as the shared config, for
# the same reason (a comment in a live config is re-read by every session, forever, while one here
# is read once). A PreToolUse hook blocks an agent from adding one; to clean a file by hand:
#   python3 scripts/lib/yaml_comments.py --write workspace.config.local.yaml
# Note WHY you set something in your commit message, or in docs/ if it is worth sharing.
# See docs/adr/0006-config-carries-no-comments.md.
# ─────────────────────────────────────────────────────────────────────────────

# Write in Thai locally while the team default stays English — see docs/agents/language.md.
# language: th

# Get the interactive HTML render of every plan locally while the team default stays
# markdown-only. ONLY `to_html` is honored from here — `auto_approve` is control flow and is
# read from the SHARED workspace.config.yaml always, so setting it here changes nothing.
# planning:
#   to_html: true

# Try /diagram-ticket locally without turning it on for the whole team yet — see
# docs/agents/diagram-generation.md.
# diagrams:
#   enabled: true

# Reach PRODUCTION with the read-only triage MCPs (pg_triage + redis_triage) from THIS machine.
# The servers themselves are registered for everyone (staging needs no opt-in); this key is the
# production half, read live by the servers — flipping it takes effect immediately, no re-register.
# Postgres prod also needs read-only DSNs in scripts/db/.env; Redis needs only `gcloud auth login`.
# `enabled: false` is the other direction: keep both servers out of this machine's sessions.
# See scripts/db/README.md · scripts/redis/README.md · docs/adr/0005
# triage:
#   prod: true
#   enabled: false

# Let the workspace TALK — a spoken acknowledgement per prompt, a line when something actually
# happens, a voice note on the Slack messages it already sends, and hold-to-dictate.
#
# `th`-ONLY BY DESIGN, and off in the shared config, so this file is the only way in. With any
# other `language` every voice command exits 0 silently (run it with -v to hear why). Run
# `aiworks voice setup` first, then `aiworks voice test`.
#
# COST, at 100 prompts a day × 22 days, on elevenlabs: every finished turn speaks a closing line,
# and neither it nor the ack hits the audio cache (unique text each time), so the bill tracks
# `autoplay.chattiness`: terse ~$48/mo · balanced ~$76/mo · chatty ~$105/mo · max ~$165/mo typical,
# up to ~$295 if every turn hits `narrate_max_per_turn` (max is extrapolated, not measured — ~$75 of
# ack + closing line, plus ~$90 of step narration at ~10 short lines a turn). (Earlier notes here
# said $14–24, then $230: the first was from when milestones almost never spoke, the second from
# before max's ack and closing line were shortened to the register they now use.)
# `tts.provider: gemini` is ~6× cheaper for 3 % fewer surviving English terms.
#
# To go quiet for a while, do NOT edit this back: MUTE THE MACHINE. `aiworks voice mute on` and the
# system output mute (the mute key / Control Centre, read live) both DISABLE what the machine SAYS,
# machine-wide — nothing summarized, nothing synthesized, no cue, no sound effect — so it then costs
# nothing at all. Neither touches `notify_voice` (audio for the team — config only) or dictation.
# `aiworks voice status` prints every switch, in order, and names which mute is holding it.
# Full doc: docs/agents/voice.md · reference: scripts/voice/README.md
# voice:
#   enabled: true
#   tts:
#     # WHOSE voice you hear. Measured on Thai (scripts/voice/README.md § Thai voice selection):
#     # openai `sage` kept the most English technical terms (98 %) and is half ElevenLabs' price;
#     # cartesia is the fastest; gemini is ~6× cheaper for 3 % fewer terms. Voice ids are keyed by
#     # provider in the shared file, so switching here never carries the wrong vendor's id along.
#     provider: openai
#     # LUFS every line is levelled to (`off` disables). Vendors ship volumes 17 LU apart — this is
#     # what makes them one level. Change it and run `aiworks voice normalize` to re-level the cache.
#     loudness: -16
#   autoplay:
#     enabled: true       # local speech; `ack`, `milestones`, `narrate` switch independently
#     # HOW MUCH it says, never whether: terse (1 sentence, the shipped length) | balanced (1-2,
#     # + a softener and a short reaction) | chatty (2-3, + the follow-through) | max (the ship's-AI
#     # register — every sentence is [subject] [state] [figure] under ~45 characters, and it talks
#     # THROUGH the turn: one short line per step as it happens, plus a word when a step fails and
#     # when something is waiting for you). Ceiling, not quota — one fact still means one sentence.
#     # `aiworks voice audition "…"` compares all four.
#     chattiness: balanced
#     # The step narration, `max` only, and the biggest mid-turn voice there is. false ⇒ keep max's
#     # ack + closing line, stop the per-step talking (~$90/mo of max's ~$165).
#     narrate: true
#     # What a narrated line is MADE of: facts (the tool's own response — "cargo test ผ่าน 42") or
#     # prose (the assistant's sentence before the call, an intention). Each falls back to the other.
#     narrate_source: facts
#     narrate_gap: 4               # seconds between narrated lines — the frequency dial
#     narrate_max_per_turn: 25     # per-turn ceiling, i.e. the cost ceiling
#     thresholds: true             # speak unbidden on a failed step, a second failure, a long turn
#     gates: true                  # speak when something WAITS for you (permission, plan, denial)
#   notify_voice:
#     enabled: true       # attach a voice note to the review-request / ship messages
#   push_to_talk:
#     enabled: true
#     # Both ⌘ keys. `fn+…` works ONLY on a built-in Apple keyboard — an external keyboard's fn is
#     # firmware-local and never reaches macOS (measured). Left/right are separate keycodes, so a
#     # side-specific chord collides with no existing shortcut.
#     hotkey: "left_cmd+right_cmd"
#     mic: default        # follows System Settings → Sound → Input; or a device NAME. Never an index

# stagehand — put what the assistant touches ON SCREEN, on this desk only. Personal for the same
# reason voice is: it moves windows on YOUR monitors. Root worktree only, and enforced
# mechanically (a linked / Superset worktree shares the same physical screen and would fight the
# root session for it), so this key does nothing in a worktree even when set. Full doc:
# docs/agents/stagehand.md; every key is documented in workspace.config.example.yaml.
# stagehand:
#   enabled: true
#   # auto = score every slot on every display by real overlap and take the cheapest — nothing
#   # pinned to a monitor, no focus stolen. `rectangle` honours your Rectangle grid exactly but
#   # must focus the target app first (Rectangle's execute-action takes no app-bundle-id).
#   placement: auto
