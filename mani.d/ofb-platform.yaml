# ofb-platform — mani projects. path is relative to THIS file dir (mani.d/), so ../agent-db resolves under the workspace root.
projects:
  turnover-commission-batch:
    desc: A Rust batch job that closes each turnover-commission round — reads the daily player turnover accumulator, computes the multi-level referral commission per player, and rolls it up into the claimable summary.
    url: git@gitlab.com:bluepicode/ofb/turnover-commission-batch.git
    path: ../turnover-commission-batch
    tags: [ofb-platform, rust]
  dev-script:
    desc: The developer scripts that use for troubleshooting on production(and usable for staging and local). It's variants of scripts for different purposes like postgres queries, and shell scripts to generate curl commands, and might add more in the future.
    url: git@gitlab.com:bluepicode/ofb/dev-script.git
    path: ../dev-script
    tags: [ofb-platform, shell, postgres]
  lotto-service:
    desc: A service to handle the lotto gambling features, currently it using the AML aggregator.
    url: git@gitlab.com:bluepicode/ofb/lotto-service.git
    path: ../lotto-service
    tags: [ofb-platform, rust]
  ofb-k6-loadtests:
    desc: K6 load tests for the platform, mostly for the backend services.
    url: git@gitlab.com:bluepicode/qa/ofb-k6-loadtests.git
    path: ../ofb-k6-loadtests
    tags: [ofb-platform, javascript]
  live-sub:
    desc: A service to subscribe the live events stream or any subscribeable events to process anything related to live features, like raindrop, live-chat/room, public-chat.
    url: git@gitlab.com:bluepicode/ofb/live-sub.git
    path: ../live-sub
    tags: [ofb-platform, rust]
  campaign-sub:
    desc: A service to subscribe the campaign events stream to process the next process, currently it subscribe for tournament and daily-checkin.
    url: git@gitlab.com:bluepicode/ofb/campaign-sub.git
    path: ../campaign-sub
    tags: [ofb-platform, rust]
  bet-aggregator:
    desc: A Rust service to aggregate the bet data full cycle bet + payout, including free-spin and feature-bet when the bet is compeleted then feed it into the redis stream.
    url: git@gitlab.com:bluepicode/ofb/bet-aggregator.git
    path: ../bet-aggregator
    tags: [ofb-platform, rust]
  crypto-watcher:
    desc: A Rust service crypto watcher to listen the crypto events/transactions from the blockchain and map into the agency wallet.
    url: git@gitlab.com:bluepicode/ofb/crypto-watcher.git
    path: ../crypto-watcher
    tags: [ofb-platform, rust]
  cashback-batch:
    desc: A Rust batch job(cronjob) to calculate the cashback from promotion to player.
    url: git@gitlab.com:bluepicode/ofb/cashback-batch.git
    path: ../cashback-batch
    tags: [ofb-platform, rust]
  game:
    desc: The game lib package, for any Rust service, It's handle most of functionality that interact with game, mainly to get/fetch game/games. It's included caching ability. 
    url: git@gitlab.com:bluepicode/ofb/game.git
    path: ../game
    tags: [ofb-platform, Rust ]
  seamless-api:
    desc: The Seamless platform for any agency that open a site for using exposed the seamless APIs, It's included the implementation documents and Interactive test suite UI. 
    url: git@gitlab.com:bluepicode/ofb/seamless-api.git
    path: ../seamless-api
    tags: [ofb-platform, next.js ]
  commission-batch:
    desc: Monthly Rust batch job that calculates agency commission and posts a summary to Slack (prod-gated).
    url: git@gitlab.com:bluepicode/ofb/commission-batch.git
    path: ../commission-batch
    tags: [ofb-platform, rust]
  mock-agency-api:
    desc: The mock API service that user for simulate the agency service for any site that using package S.
    url: git@gitlab.com:bluepicode/ofb/mock-agency-api.git
    path: ../mock-agency-api
    tags: [ofb-platform, json ]
  customization-widget:
    desc: The package library for the player sites, to convert the template data into the real component.
    url: git@gitlab.com:bluepicode/ofb/customization-widget.git
    path: ../customization-widget
    tags: [ofb-platform, next.js]
  front-end:
    desc: The web app for player users, it's one of the player site theme(OHANABET) concept in platform.
    url: git@gitlab.com:bluepicode/ofb/front-end.git
    path: ../front-end
    tags: [ofb-platform, next.js]
  ofb-backoffice-cypress:
    desc: The cross-repo QA suite for the backoffice repo. It's contains the E2E UI tests for the backoffice. Including the Newman API tests for the platform.
    url: git@gitlab.com:bluepicode/qa/ofb-backoffice-cypress.git
    path: ../ofb-backoffice-cypress
    tags: [ofb-platform, cypress, newman ]
  backoffice:
    desc: The backoffice CRM for Admins a Agents to manage the platform. Under the concept of Agency and sites with different theme and packages. currently it's gently convert into Bullet Proof React pattern.
    url: git@gitlab.com:bluepicode/ofb/backoffice.git
    path: ../backoffice
    tags: [ofb-platform, next.js ]
  agent-webservice:
    desc: The agent-webservice repo.
    url: git@gitlab.com:bluepicode/ofb/agent-webservice.git
    path: ../agent-webservice
    tags: [ofb-platform, rust]
  agent-paotung-cypress:
    desc: The agent-paotung-cypress repo.
    url: git@gitlab.com:bluepicode/qa/agent-paotung-cypress.git
    path: ../agent-paotung-cypress
    tags: [ofb-platform, cypress]
  paotung-template:
    desc: The paotung-template repo.
    url: git@gitlab.com:bluepicode/ofb/paotung-template.git
    path: ../paotung-template
    tags: [ofb-platform, Next.js]
  agent-db:
    desc: The agent-db repo.
    url: git@gitlab.com:bluepicode/ofb/agent-db.git
    path: ../agent-db
    tags: [ofb-platform, postgres]
