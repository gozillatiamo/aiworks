# Generated by `aiworks codex`; do not edit by hand.
#:schema https://developers.openai.com/codex/config-schema.json

[features]
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 8

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "total-input-tokens",
  "context-window-size",
]

[mcp_servers.mcp-image]
command = "bash"
args = ["-c", "ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd); exec bash \"$ROOT/scripts/mcp/mcp-image.sh\""]

[mcp_servers.sonarqube]
url = "http://localhost:25434/mcp"
bearer_token_env_var = "SONARQUBE_TOKEN"

[mcp_servers.postgres_main]
command = "npx"
args = ["-y", "mcp-remote@latest", "http://localhost:25432/sse"]
startup_timeout_sec = 30

[mcp_servers.postgres_secondary]
command = "npx"
args = ["-y", "mcp-remote@latest", "http://localhost:25433/sse"]
startup_timeout_sec = 30

[mcp_servers.redis]
command = "uvx"
args = ["--from", "redis-mcp-server@latest", "redis-mcp-server", "--url", "redis://localhost:6379"]

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.graphify_docs]
command = "graphify-mcp"

[mcp_servers.n8n-mcp]
command = "bash"
args = ["-c", "ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd); exec bash \"$ROOT/scripts/mcp/n8n-mcp.sh\""]
