harnesses:
  - claude
  - cursor
  - codex
org:
  name: bluePi
  product: "OFB"

language: en
case_report_language: th

vcs:
  provider: gitlab
  auto_merge: false

notify:
  enabled: true
  provider: slack
  channel: "#dev-oneforbet"
  dm_on_incomplete: "U081LPQ4REH"

observability:
  enabled: true
  provider: signoz
  base_url: "https://signoz.afufc.com"

tracker:
  provider: jira
  ticket_prefix: OFB
  base_url: "https://bluepi.atlassian.net"
  statuses:
    to_do:   "TO DO"
    in_progress:   "IN PROGRESS"
    code_review:   "CODE REVIEW"
    ready_to_merge: "READY TO MERGE"
    ready_to_test: "READY TO TEST"
    testing:       "TESTING"
    done:          "DONE"

branch_model:
  feature_base: develop
  fix_base:     main

quality_gate:
  provider: none

review:
  level: strict
  max_rounds: 14
  max_regression_fixes: 3
  max_stall_reattempts: 3
  max_escalation_attempts: 3

loadtest:
  tolerance_pct: 10
  noise_runs: 2
  noise_ceiling_multiple: 2
  max_fix_rounds: 3
  baseline_cache: ~/.cache/aiworks/loadtest-baselines

planning:
  auto_approve: false
  to_html: false

diagrams:
  enabled: true
  provider: mermaid-ink
  theme: default
  max_per_ticket: 2

artifacts:
  enabled: false

headroom:
  enabled: true
  statusline: true

voice:
  enabled: false
  tts:
    provider: elevenlabs
    voice:
      elevenlabs: "EXAVITQu4vr4xnSDxMaL"
      cartesia: "ccc7bb22-dcd0-42e4-822e-0731b950972f"
      gemini: "Leda"
      openai: "sage"
    loudness: -16
  stt:
    provider: openai
  summarizer:
    provider: openai
    model:
      openai: gpt-4o-mini
      gemini: gemini-2.5-flash
      claude: claude-haiku-4-5-20251001
  sfx:
    provider: elevenlabs
  autoplay:
    enabled: false
    ack: true
    milestones: true
    narrate: true
    narrate_intent: true
    narrate_source: say
    narrate_gap: 0
    narrate_max_per_turn: 0
    thresholds: true
    long_turn_seconds: 300
    gates: true
    milestone_every_turn: true
    chattiness: terse
  notify_voice:
    enabled: false
  push_to_talk:
    enabled: false
    hotkey: "left_cmd+right_cmd"
    mic: default
    preview:
      provider: elevenlabs
      window_seconds: 12
    auto_send: true
  cache:
    max_mb: 500

stagehand:
  enabled: false
  placement: halves
  rectangle_action: right-half
  editor: cursor
  editor_process: Cursor
  browser: chrome
  browser_process: Google Chrome
  browser_account: ""
  browser_profile: ""
  protect_process: iTerm2
  protected_half: left
  displays: external
  max_tabs: 8
  debounce_seconds: 2
  follow_max: 3
  interact: true
  url_hosts: "atlassian.net gitlab.com github.com slack.com signoz sonar figma.com mermaid.live localhost 127.0.0.1"
  triggers:
    code: true
    browser: true
    narration: true

triage:
  enabled: true
  prod: false

monitoring:
  targets:
    agent/staging: agent-384510
    agent/prod: agent-384510
    onegame/staging: onegame-427115
    onegame/prod: onegame-427115

test_suite:
  max_fix_rounds: 3
  max_suite_repair_attempts: 3

build:
  max_continuation_passes: 3

dev_cycle:
  token_budget: 6000000

products:
  - id: ofb-platform
    repos:
      - url: git@gitlab.com:bluepicode/qa/agent-ofb-cypress.git
        kind: test-suite
        desc: "The cross-repo QA suite for the front-end repo. It's contains the E2E UI tests for the front-end (OHANABET skin)."
        lang: cypress
        green: "tests via cypress passed successfully"
        feature_base: develop
        fix_base: develop

      - url: git@gitlab.com:bluepicode/ofb/turnover-commission-batch.git
        kind: backend
        desc: A Rust batch job that closes each turnover-commission round — reads the daily player turnover accumulator, computes the multi-level referral commission per player, and rolls it up into the claimable summary.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"


      - url: git@gitlab.com:bluepicode/ofb/agent-db.git
        kind: migration
        desc: Data storage and Database migration for the platform, included all data storage kinds.
        lang: postgres
        distribute: none
        green: "migrate passed successfully and rollback able"
        guardian_focus: "secrets"

      - url: git@gitlab.com:bluepicode/ofb/paotung-template.git
        kind: web-app
        desc: The web app for player users, it's one of the player site theme(PAOTUNG) concept in platform.
        lang: next.js
        green: "tests via stroybook and lint passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/customization-widget.git
        kind: package
        desc: The package library for the player sites, to convert the template data into the real component.
        lang: next.js
        green: "tests via stroybook and lint passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/front-end.git
        kind: web-app
        desc: The web app for player users, it's one of the player site theme(OHANABET) concept in platform.
        lang: next.js
        green: "tests via stroybook and lint passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/agent-webservice.git
        kind: backend
        desc: The monolithic backend service for the platform. It's contains mostly the business logic for the platform. Currently, it also temporary background thread to run consumers to consume event stream to trigger process across multiple features form the bet-payout distribution.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection, input validation"
        known_false_reds: "a full cargo test run is non-deterministic because the suite shares one test database, so an unrelated test can fail on ordering or leftover rows; re-run the scoped test in isolation against the base branch before calling it a real failure"

      - url: git@gitlab.com:bluepicode/qa/agent-paotung-cypress.git
        kind: test-suite
        desc: The cross-repo QA suite for the paotung-template repo. It's contains the E2E UI tests for the paotung-template.
        lang: cypress
        green: "tests via cypress passed successfully"
        feature_base: develop
        fix_base: develop

      - url: git@gitlab.com:bluepicode/ofb/backoffice.git
        kind: web-app
        desc: The backoffice CRM for Admins a Agents to manage the platform. Under the concept of Agency and sites with different theme and packages. currently it's gently convert into Bullet Proof React pattern.
        lang: next.js
        green: "tests via stroybook and lint passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/qa/ofb-backoffice-cypress.git
        kind: test-suite
        desc: The cross-repo QA suite for the backoffice repo. It's contains the E2E UI tests for the backoffice. Including the Newman API tests for the platform.
        lang: cypress, newman
        green: "tests via cypress and newman passed successfully"
        feature_base: develop
        fix_base: develop

      - url: git@gitlab.com:bluepicode/ofb/mock-agency-api.git
        kind: mock
        desc: The mock API service that user for simulate the agency service for any site that using package S.
        lang: json
        green: "The service is running with healthy"
        known_false_reds: "scripts/dev.sh test goes red with 'mock did not become ready' when port 3001 is already taken by an unrelated local server; check with lsof -nP -iTCP:3001 and re-run with DEV_PORT=<free port> before treating it as a real failure"

      - url: git@gitlab.com:bluepicode/ofb/commission-batch.git
        kind: backend
        desc: Monthly Rust batch job that calculates agency commission and posts a summary to Slack (prod-gated).
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/seamless-api.git
        kind: web-app
        desc: The Seamless platform for any agency that open a site for using exposed the seamless APIs, It's included the implementation documents and Interactive test suite UI.
        lang: next.js
        green: "run and tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/game.git
        kind: package
        desc: The game lib package, for any Rust service, It's handle most of functionality that interact with game, mainly to get/fetch game/games. It's included caching ability.
        lang: rust
        green: "unit tests and integration passed successfully"
        guardian_focus: "secrets, data-protection"
        feature_base: main
        fix_base: main

      - url: git@gitlab.com:bluepicode/ofb/cashback-batch.git
        kind: backend
        desc: A Rust batch job(cronjob) to calculate the cashback from promotion to player.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/crypto-watcher.git
        kind: backend
        desc: A Rust service crypto watcher to listen the crypto events/transactions from the blockchain and map into the agency wallet.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/bet-aggregator.git
        kind: backend
        desc: A Rust service to aggregate the bet data full cycle bet + payout, including free-spin and feature-bet when the bet is compeleted then feed it into the redis stream, mostly it used for tournament campaign and public chat boardcast stream.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/campaign-sub.git
        kind: backend
        desc: A service to subscribe the campaign events stream to process the next process, currently it subscribe for tournament and daily-checkin.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/ofb/live-sub.git
        kind: backend
        desc: A service to subscribe the live events stream or any subscribeable events to process anything related to live features, like raindrop, live-chat/room, public-chat.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection"

      - url: git@gitlab.com:bluepicode/qa/ofb-k6-loadtests.git
        kind: test-suite
        suite_kind: load
        desc: K6 load tests for the platform, mostly for the backend services.
        lang: javascript
        green: "tests via k6 passed successfully, and no tracked metric degraded against the base branch"
        feature_base: main
        fix_base: main

      - url: git@gitlab.com:bluepicode/ofb/lotto-service.git
        kind: backend
        desc: A service to handle the lotto gambling features, currently it using the AML aggregator.
        lang: rust
        green: "unit tests + integration tests passed successfully"
        guardian_focus: "secrets, data-protection, input validation"

      - url: git@gitlab.com:bluepicode/ofb/dev-script.git
        kind: script
        desc: The developer scripts that use for troubleshooting on production(and usable for staging and local). It's variants of scripts for different purposes like postgres queries, and shell scripts to generate curl commands, and might add more in the future.
        lang: shell
        guardian_focus: "secrets, data-protection"
