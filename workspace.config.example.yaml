# ─────────────────────────────────────────────────────────────────────────────
# workspace.config.yaml — the ONE file each organization fills in.
#
# Copy this to `workspace.config.yaml` and edit. It is the human-readable source of
# truth for the whole orchestration:
#   • skills + agents read it (and docs/agents/issue-tracker.md) at runtime;
#   • `scripts/aiworks sync` reads `products:` (the repo URLs) and sets EVERYTHING up —
#     generates mani.d/<product>.yaml, clones each repo, builds the codegraph index,
#     installs the skill packs, seeds hooks, scaffolds CLAUDE.md + scripts/dev.sh;
#   • it ALSO generates a multi-root `<workspace-basename>.code-workspace` from `products:` —
#     one folder root per repo (+ the meta-repo as the first root) — so VS Code / Cursor show
#     EACH repo as its own Source Control panel (a gitignored clone is otherwise skipped by the
#     folder-open git auto-detect). Open it with:  cursor <workspace>.code-workspace
#     It is committed with the meta-repo (like mani.d/) and re-generated on every sync/add/remove;
#     only its `folders` array is regenerated — any `settings` you add to it survive;
#   • the adapters read their slice from scripts/{vcs,tracker}/.env;
#   • the dev-cycle workflow keeps a mirrored CONFIG block at the top of
#     .claude/workflows/dev-cycle.js (Workflow scripts cannot read the filesystem at
#     runtime). `scripts/aiworks sync` — and every `add` / `remove` — REGENERATES that
#     block from THIS file automatically (`scripts/aiworks config` is the standalone step),
#     so the mirror always tracks this file. You never hand-edit dev-cycle.js.
#
# The fast path to onboard repos:  add their URLs under `products:` below, then run
#   scripts/aiworks sync          # clone + onboard every declared repo (idempotent)
#
# PERSONAL OVERRIDES (not shared): keys you want for YOURSELF only go in a git-ignored
# `workspace.config.local.yaml` — the workspace-config analogue of .claude/settings.local.json.
# It overrides this file for everything read at RUNTIME (chat, agents, interactive skills); the
# committed workflow mirror is always regenerated from THIS shared file only, so your prefs never
# leak into git. See workspace.config.local.example.yaml.
#
# KEEPING THIS TEMPLATE HONEST: a new org bootstraps its config by COPYING this file
# (`aiworks add` does it automatically), so a key that only ever lands in a live
# workspace.config.yaml is a feature nobody else can discover. `aiworks config` — which
# `aiworks sync` runs on every pass — WARNS when a live key is undocumented here. Add the key
# to this file in the same change, with a neutral/OFF default and the comment that explains it.
#
# THIS FILE IS THE DOCUMENTATION; THE LIVE CONFIG IS DATA. Every comment you see here is
# deliberate, and the live `workspace.config.yaml` carries NONE of them — no header, no section
# divider, no trailing note, no tombstone for a removed key. Reason: CLAUDE.md `@`-injects the
# live config into EVERY session, so a comment there is re-read on every turn forever, while a
# comment here is read once by whoever sets the workspace up. The bootstrap copy strips them for
# you (`aiworks add`), a PreToolUse hook blocks an agent from adding one, and `aiworks config`
# warns if one arrives by hand. Clean a file with:
#   python3 scripts/lib/yaml_comments.py --write workspace.config.yaml
# So: explain a key HERE (and put measurements / design rationale in docs/ or the owning script's
# README) — never in the file the workspace actually runs on. See docs/adr/0006-config-carries-no-comments.md.
# ─────────────────────────────────────────────────────────────────────────────

org:
  name: Acme                       # shown in agent copy / summaries
  product: "<one-line product description>"   # the domain agents ground research/copy in

# ── Output language (governs what language EVERY agent writes in) ──────────────
# See docs/agents/language.md for the full convention. This governs language ONLY — never
# which tools run or what the work is; an `en` run and a `th` run take the same process.
language: en                       # en (default) | th
                                   # th → "English spine, Thai prose": write prose in Thai (CLI chat,
                                   #   Jira ticket bodies/comments, PR/MR descriptions + review discussion,
                                   #   code-review comments, plans/PRDs shown to you, Slack), but keep an
                                   #   English SPINE — titles + every section heading + labels/enum values,
                                   #   ALL code + code comments + git commit messages + branch names, and
                                   #   technical/transliterated/domain terms + proper nouns. Code and
                                   #   checked-in repo docs (docs/, README, ADRs, committed PRD/BRD files)
                                   #   are ALWAYS English. Numerals/dates stay Arabic. Default en = no change.

# ── Version control ──────────────────────────────────────────────────────────
vcs:
  provider: github                 # github | gitlab  (auto-detected from the repo URL/origin if omitted)
  auto_merge: true                 # after review + the test-suite gate validate the candidate, the
                                   #   dev-cycle squash-merges the PR/MR automatically, then distributes
                                   #   the merged build. false → it still reviews + runs the test-suite gate,
                                   #   then STOPS and leaves the PR/MR OPEN for a human to merge (nothing is
                                   #   merged or distributed). Override for a single repo with repos[].auto_merge.

# ── Notifications ──────────────────────────────────────────────────────────────
# AFTER the run finishes its pre-merge work (every repo built + reviewed and the cross-repo
# test-suite gate green) the dev-cycle can post a "please review" digest to chat. This phase
# runs LAST (after Summary) and ONLY when BOTH hold:
#   • notify.enabled: true        (this block), AND
#   • vcs.auto_merge:  false      (auto-merge ON ⇒ the run merges + distributes itself, so there
#                                  is nothing left for a human to review — the notification is skipped).
# The message is the open PR/MR per repo for the ticket:
#     Please review, FM-12 Add the vet-visit reminder.
#     - your-app: https://github.com/your-org/your-app/pull/42
#     - your-tests: https://github.com/your-org/your-tests/pull/7
# Posting goes through the notify adapter (scripts/notify/), provider-agnostic like vcs/tracker.
notify:
  enabled: false                   # true → post the review-request when auto_merge is off (see above)
  provider: slack                  # slack (the only provider today)
  channel: "#code-reviews"         # the Slack channel the digest is posted to (id or #name). The token/
                                   #   webhook live in scripts/notify/.env (seeded by `aiworks sync`).

# ── Observability (the traces/logs the perf + triage agents read) ──────────────
# Where the performance-engineer and oncall agents get ground truth about a
# RUNNING environment. Read through the observability adapter (scripts/observability/),
# provider-agnostic like vcs/tracker/notify.
observability:
  enabled: false                   # true → those agents may pull traces + logs when they
                                   #   root-cause a deployed-env incident. false → they work
                                   #   from code, tests and the diff only.
  provider: signoz                 # signoz (the only provider today)
  base_url: ""                     # your instance root, e.g. https://signoz.your-org.com — the
                                   #   API key lives in scripts/observability/.env, never here.

# ── Issue tracker ──────────────────────────────────────────────────────────────
tracker:
  provider: notion                 # notion | jira
  ticket_prefix: FM                # FM | APP | …  → drives the ticket-id regex (e.g. FM-\d+)
  base_url: ""                     # the board's web root, e.g. https://your-org.atlassian.net — used
                                   #   to turn a bare ticket key into a link (stagehand opens
                                   #   <base_url>/browse/<KEY>). A public hostname, not a credential;
                                   #   the API token stays in scripts/tracker/.env.
  # Canonical workflow phase → the org's REAL status name (what the tracker shows / Jira
  # transitions to). Skills/agents/dev-cycle use these names when moving a ticket.
  # Declare WHATEVER your board uses — every key here is mirrored into the workflow. The
  # dev-cycle drives the ticket FORWARD ONLY, at aggregate milestones (it owns the status;
  # the per-repo agents don't), and at each milestone it uses the best status you've
  # declared: e.g. after review it prefers `ready_to_merge`, else `ready_to_test`. Extra
  # keys (e.g. `to_do`, `code_review`, `ready_to_merge`) are optional and fully supported.
  statuses:
    not_started:   "Not started"
    in_progress:   "In progress"
    # code_review:   "Code review"     # optional — richer boards can add intermediate states
    # ready_to_merge: "Ready to merge"
    ready_to_test: "Ready to test"
    testing:       "Testing"
    done:          "Done"

# ── Branch model (defaults; a repo may override under products[].repos[].base) ─
branch_model:
  feature_base: develop            # base branch for feature/* work
  fix_base:     main               # base branch for fix/* work

# ── Quality gate (the guardian's static-analysis gate) ─────────────────────────
quality_gate:
  provider: sonarqube              # sonarqube | none

# ── Review depth (how much the Review phase is allowed to report) ──────────────
review:
  level: strict                    # strict (default) | thorough
                                   #   strict   → the three review gates (code-reviewer + guardian
                                   #     + performance) report BLOCKING must-fixes ONLY: no
                                   #     "[minor / fold-in]" comments, no Improvement tickets. The
                                   #     merge waits on real defects and nothing else.
                                   #   thorough → must-fixes AND the nice-to-have tier — small
                                   #     fold-ins applied inside the same PR/MR, larger follow-ups
                                   #     filed as Improvement tickets.

# ── Load-test gate (the base-branch NON-DEGRADATION rule) ─────────────────────
# Read only by a repo declared `suite_kind: load` (see products[].repos[] below). A plain
# pass/fail suite ignores this block entirely. Full behaviour: docs/agents/loadtest-gate.md
loadtest:
  tolerance_pct: 10                # a tracked metric may degrade this much (%) against the base
                                   #   branch before it counts as a regression. This is the FLOOR
                                   #   of the effective threshold, not the threshold itself — see
                                   #   noise_runs.
  noise_runs: 2                    # how many times the BASE build is run to measure the
                                   #   environment's own run-to-run spread (its "noise floor"). The
                                   #   effective per-metric threshold is
                                   #   max(tolerance_pct, measured noise floor), so a jittery
                                   #   laptop cannot manufacture a regression. Minimum 2 — one run
                                   #   measures nothing. Higher = steadier floor, more wall clock.
  noise_ceiling_multiple: 2        # if the measured noise floor exceeds tolerance_pct × this, the
                                   #   environment is too coarse to judge the change at all: the
                                   #   gate returns UNAVAILABLE (a loud skip, banner in the run
                                   #   summary) instead of widening the threshold until anything
                                   #   passes. An honest "cannot tell" beats a fake verdict.
  max_fix_rounds: 2                # a regression the developer ATTRIBUTES to the change loops back
                                   #   for a fix, then the candidate is re-run (the baseline is
                                   #   cached, so a loop costs one run, not three). Rounds before
                                   #   the repo halts for a human. A load run is expensive — small.
  baseline_cache: ~/.cache/aiworks/loadtest-baselines
                                   # where base-build results are cached, keyed by
                                   #   <repo>/<scenario>/<base-sha>/<env-fingerprint>.
                                   #   Machine-global ON PURPOSE: a Superset worktree is ephemeral,
                                   #   so a cache inside the repo would be re-measured for every
                                   #   worktree. The base SHA in the key makes a moved base
                                   #   self-invalidating; the env fingerprint stops a baseline from
                                   #   one machine being compared against a candidate from another.

# ── Planning (governs every planning step — e.g. the dev-cycle Kickoff) ────────
planning:
  auto_approve: true               # auto-approve-plan. true → execution proceeds straight from the
                                   #   plan (no review). false → after a plan is produced the run
                                   #   STOPS for a human to review + APPROVE before execution (build);
                                   #   re-run the dev-cycle with --approve-plan to proceed past the gate.
                                   #   LOCAL-FIRST: the only control-flow key a personal
                                   #   workspace.config.local.yaml may override, headless runs included
                                   #   (the plan gate is reversible — review, the test-suite gate and the
                                   #   merge all still stand after it). Resolution is fail-closed: absent
                                   #   from a local `planning:` block reads as false, never as this
                                   #   default. See docs/adr/0003.
  to_html: false                   # plan-to-html. true → each plan is ALSO rendered to a self-contained
                                   #   interactive HTML doc (the write-interactive-docs skill), alongside
                                   #   the plan markdown — handy for sharing/reviewing when auto_approve is off.

# ── Diagram generation (/diagram-ticket) ───────────────────────────────────────
# Renders a Mermaid diagram for a ticket and attaches it to the ticket (the image + a
# mermaid.live link so a human can keep editing it) — see docs/agents/diagram-generation.md.
diagrams:
  enabled: false                   # MASTER switch (default OFF). A diagram ENHANCES a ticket's
                                   #   spec rather than being a required deliverable, so when this
                                   #   is off the step is skipped QUIETLY — unlike the design /
                                   #   image-generation gates, it never fails a run loudly.
  provider: mermaid-ink            # mermaid-ink (the only provider today) — no API key needed
  theme: default                   # default | neutral | dark | forest
  max_per_ticket: 2                # budget cap: the MOST diagrams attached to a single ticket

# ── Artifacts (publish an .html deliverable as a shareable Claude Artifact) ─────
artifacts:
  enabled: false                   # MASTER switch (default OFF). With planning.to_html on, the
                                   #   rendered plan/doc is a LOCAL file that only its author can
                                   #   open; true → it is ALSO published as a (private) Claude
                                   #   Artifact and the run reports the URL, which is what makes it
                                   #   reviewable by someone else. Publishing is main-agent-only —
                                   #   a subagent hands the prepped file back — and sharing it with
                                   #   the org stays MANUAL. See docs/agents/plan-artifacts.md.

# ── Design (governs ALL Figma usage across the workspace) ──────────────────────
# How the team works with Figma — see docs/agents/figma.md for the full convention.
design:
  enabled: false                   # MASTER Figma switch (default OFF). false → NO agent calls Figma:
                                   #   the /prd-design design phase is skipped (tickets carry build-ready specs,
                                   #   no frames) and the dev/QA agents build from the spec instead of a
                                   #   Figma screenshot. true → the design pipeline runs (planner → assets
                                   #   → designer) and needs a connected Figma MCP. Turn this ON to design.
  figma_file_key: ""               # the org's ONE canonical design file — the key in
                                   #   figma.com/design/<KEY>/…. Set → every /prd-design run builds its screens
                                   #   as a NEW PAGE inside THIS file, reusing its variables/components
                                   #   (zero orphan files); tickets link node URLs within it. Empty → each
                                   #   run creates a NEW (orphan) file and the run WARNS how to configure
                                   #   this. Only consulted when enabled: true.
  page_naming: "{work_key} / {feature}"   # page-name template inside the canonical file. Tokens:
                                   #   {work_key} (e.g. phase-2) and {feature}. The default gives one page
                                   #   per feature so parallel designers don't collide; use "{work_key}"
                                   #   for a single shared page per run.

# ── Image generation (the graphic-designer's asset pipeline; feeds the design phase) ──
# How Fiona (graphic-designer) makes assets via the mcp-image server — see
# docs/agents/image-generation.md for setup (the GEMINI_API_KEY lives in the git-ignored
# .claude/settings.local.json, never here).
image_generation:
  enabled: false                   # MASTER switch for mcp-image generation (default OFF). false →
                                   #   the graphic-designer generates NO images (returns every asset
                                   #   'unavailable'; the design phase stays specs/placeholder-only).
                                   #   true → real assets via mcp-image, which needs GEMINI_API_KEY.
                                   #   `aiworks sync` only wires up the mcp-image server when this is true.
  quality: balanced                # fast | balanced | quality → the mcp-image IMAGE_QUALITY preset
                                   #   (seeded into .claude/settings.local.json env by `aiworks sync`).
  max_per_request: 2               # budget cap: the MOST generations the graphic-designer fires per
                                   #   request (keeps Gemini spend bounded). Raise only when needed.

# ── Voice (scripts/voice/) — spoken acknowledgements, milestones, dictation ────
# A `th`-ONLY FEATURE, OFF BY DEFAULT, and per-person. The gate lives in scripts/voice/lib.sh:
# with any other `language` every voice command exits 0 SILENTLY (run it with -v to hear why),
# so this block is inert for the whole team as shipped. A teammate opts in through the
# git-ignored workspace.config.local.yaml — never by editing this file.
# Credentials never live here: ~/.config/aiworks/voice.env (mode 600), with scripts/voice/.env
# as a per-clone override. Full doc: docs/agents/voice.md · scripts/voice/README.md
voice:
  enabled: false                   # MASTER switch for the whole feature
  tts:
    provider: elevenlabs           # elevenlabs | openai | cartesia | gemini
                                   #   Not interchangeable. Measured on Thai+English dev sentences
                                   #   (README § Thai voice selection), best voice of each vendor,
                                   #   median of 5 transcription passes — how many English technical
                                   #   terms survive as Latin script, and how fast:
                                   #     openai      98 %, 2.3 s, ~$45/1M chars — best measured
                                   #     cartesia    95 %, FASTEST (1.8 s), native Thai voices
                                   #     elevenlabs  86 %, 4.2 s, ~$100/1M — most CONSISTENT voice
                                   #     gemini      84 %, slowest + variable, ~6× cheaper than 11labs
    # Voice ids are keyed BY PROVIDER on purpose: switching `provider` must never carry a voice
    # id from the wrong vendor. Each default below is that vendor's BEST-MEASURED Thai voice, not
    # its most famous one. A one-sentence audition cannot rank these — the transcriber is the
    # noisy component (byte-identical audio scored 0/6 then 6/6 on consecutive passes), which is
    # why every number here is a median of five passes over five sentences.
    voice:
      elevenlabs: "EXAVITQu4vr4xnSDxMaL"                 # Sarah (f) — steadiest measured (±1)
      cartesia: "ccc7bb22-dcd0-42e4-822e-0731b950972f"   # Suda (f, native Thai)
      gemini: "Leda"                                     # (f) — on Thai the MODEL decides, not the voice
      openai: "sage"                                     # (f) — best Thai voice of any vendor here
    loudness: -16                  # integrated loudness (EBU R128) every synthesized line is
                                   #   levelled to, -1.5 dBTP ceiling. NOT cosmetic: vendors ship
                                   #   wildly different volumes and so do voices inside one vendor
                                   #   (17 LU apart, measured), so switching provider silently
                                   #   changed how loud the assistant was. It also makes `--cue`
                                   #   meaningful — the bed gain is a fixed number, which can only
                                   #   mean one thing if the voice under it is at one level.
                                   #   `off` disables it. Re-level an existing cache with
                                   #   `aiworks voice normalize` (local ffmpeg, no API spend).
  stt:
    provider: openai               # openai (gpt-4o-transcribe, best measured) | gemini (cheapest)
                                   #   | elevenlabs (accurate, over-capitalizes)
  # Turns a finished turn into the ONE line that gets spoken. Model is keyed by provider for the
  # same reason the voice id is. `claude` means the headless CLI (`claude -p`), no API key needed.
  summarizer:
    provider: openai               # openai | gemini | claude
    model:
      openai: gpt-4o-mini
      gemini: gemini-2.5-flash
      claude: claude-haiku-4-5-20251001
  sfx:
    provider: elevenlabs           # sound effects (the cues mixed under a spoken line)
  # Local speech. `enabled` is the master switch; the three below are independently useful — the
  # per-prompt acks are the first thing to tire of, while the milestones are the reason to turn
  # any of this on, so one flag for all three would force an all-or-nothing choice.
  # To go quiet for a while, do not edit this — mute. `aiworks voice mute on` applies machine-wide
  # at once, and MUTING THE SYSTEM OUTPUT does the same thing (it is read live from macOS): either
  # one DISABLES what the machine says — nothing summarized, nothing synthesized, no cue and no
  # sound effect played, so it then costs nothing — without touching `notify_voice` or dictation.
  autoplay:
    enabled: false
    ack: true                      # a spoken acknowledgement for every prompt
    milestones: true               # the closing line — what the finished turn actually produced
    narrate: true                  # the RUNNING COMMENTARY, chattiness: max ONLY (inert elsewhere):
                                   #   one line each time something is WORKED OUT, spoken while the
                                   #   work happens — "root cause คือ submodule pointer ค้างที่ OG-631
                                   #   เพราะ teardown.sql พัง จะ bump แล้วรัน scoped test ใหม่".
                                   #   `false` keeps max's ack + closing line without the mid-turn
                                   #   talking; it is the level's main cost lever (see chattiness).
    narrate_source: say            # say (default) | insight | facts | prose. What a line is ABOUT.
                                   #   say → ONLY what the assistant named itself: a `SAY[group]: …`
                                   #     line in its own prose, spoken verbatim mid-turn. The unit is
                                   #     the thing worked out, not the tool call — nobody listening
                                   #     wants to hear which command is running, they want to hear
                                   #     what it MEANT. No tag ⇒ SILENCE, which is correct for work
                                   #     that has not concluded anything yet. Costs no tokens: the
                                   #     line is already written. Groups and cues are the closing
                                   #     line's (`VOICE[…]`); a bare `SAY:` speaks with no cue.
                                   #   insight → the same, plus a summarizer GUESS at an untagged
                                   #     block. Opt-in on measurement, not taste: over 12 real
                                   #     mid-turn blocks a model judging "is this a conclusion?"
                                   #     refused the best finding, spoke a status line 3/3 even after
                                   #     the prompt banned exactly that, and spoke a claim the NEXT
                                   #     block retracted. A model cannot know a later block corrects
                                   #     an earlier one; the assistant can.
                                   #   facts → the step metronome, and what `max` used to do: two
                                   #     lines per tool call from the payload itself ("รัน cargo test"
                                   #     → "cargo test ผ่าน 42"), a subject and a FIGURE, 3–8 words,
                                   #     the register of the character this level imitates ("The
                                   #     armour is now at 92%"). Costs no tokens at all. It was too
                                   #     much to listen to — correct about the machinery, silent about
                                   #     the meaning — which is why it is opt-in now.
                                   #   prose → the assistant's own sentence from just before the call,
                                   #     verbatim. Cheapest, and judges nothing. `facts` and `prose`
                                   #     fall back to each other; `insight` deliberately does not
                                   #     fall back at all, or "รัน cd" returns one silence at a time.
    narrate_intent: true           # `narrate_source: facts` ONLY — the BEFORE half of its step pair.
                                   #   `false` = results only, which leaves every wait unexplained: a
                                   #   90-second test run and a wedged command sound identical to
                                   #   someone who is not watching the screen. Inert under `insight`,
                                   #   which has no steps in it to announce.
    narrate_gap: 0                 # seconds between narrated lines, 0–60, and **0 = no floor**, the
                                   #   default at max. It went 9 → 4 → 0: any floor eats one half of
                                   #   every pair, because the two halves of one step arrive about a
                                   #   second apart — and a level whose promise is "tell me every
                                   #   action" cannot have a rate limiter in front of it. What bounds
                                   #   the talking instead is the QUEUE, which drops a narration that
                                   #   has gone stale (12 s) or is more than 3 deep for one session,
                                   #   oldest first — load-shedding where it can see how far behind
                                   #   the voice actually is. Set a number to buy quiet; at max a
                                   #   number means "skip some actions". Also the queue's drain floor.
    narrate_max_per_turn: 0        # the per-TURN ceiling, 0–500, and **0 = no ceiling**, the default.
                                   #   A number bounds a turn's TTS spend, but a ceiling is a cliff,
                                   #   not a throttle: the turn goes silent from line N on, which is
                                   #   the "why did it stop talking?" that max exists to answer. When
                                   #   a number IS set and it bites, the log says so (`-v`) rather
                                   #   than going quietly silent.
    thresholds: true               # speak up UNBIDDEN when something crosses a line, the way the
                                   #   films' AI does ("you've been awake for nearly seventy-two
                                   #   hours"). Three: a step FAILED (red cue, and it bypasses the
                                   #   rate floor — a failure is worth interrupting for); the SAME
                                   #   step failed TWICE (the second one is the news); and the turn
                                   #   passing long_turn_seconds. Each is SINGLE-SHOT per turn and
                                   #   fires only on a step that actually ran — that is what makes
                                   #   it a threshold and not the deleted heartbeat, which fired on
                                   #   a clock whether or not anything had happened.
    long_turn_seconds: 300         # (30–3600) when a still-running turn is worth mentioning ONCE,
                                   #   and once more at 3×. Only read when thresholds is true.
    gates: true                    # speak when the run STOPS AND WAITS FOR YOU: a permission
                                   #   prompt ("ขออนุญาตรัน cargo test ค่ะ"), a plan up for approval,
                                   #   an auto-mode DENIAL (invisible otherwise — it never becomes a
                                   #   prompt). NOT plain idle — nothing is blocked when you simply
                                   #   have not typed yet. Independent of chattiness on purpose:
                                   #   a gate is a WHETHER, not a HOW MUCH. It never reads the
                                   #   notification's own English text aloud — an event it cannot
                                   #   classify stays silent.
    milestone_every_turn: true     # true → EVERY finished turn speaks its result (the half you
                                   #   cannot get from glancing at the screen; a version that spoke
                                   #   only on a declared event announced the START of the work and
                                   #   then never said it was done). A turn can name its own line
                                   #   with a `VOICE[group]: …` tag — free, exact, and it picks the
                                   #   cue; without one the reply is summarized (~$0.01/turn).
                                   #   false → the conservative mode: only a TAGGED turn speaks.
    chattiness: terse              # HOW MUCH it says when it speaks, never WHETHER (that is the
                                   #   switches above): terse (1 sentence, facts only) |
                                   #   balanced (1-2, + a softener and a short reaction) | chatty
                                   #   (2-3, + the follow-through) | max (the register of a ship's
                                   #   AI: every sentence is [subject] [state] [figure], and it TALKS
                                   #   THROUGH the turn — a conclusion out loud each time something is
                                   #   worked out, plus the thresholds and gates above. The only level
                                   #   that narrates mid-turn, and it needs `narrate: true` to be
                                   #   itself).
                                   #   `max`'s ack + closing line are SHORTER than chatty's, which
                                   #   looks wrong on a ladder until you see what the ladder grades:
                                   #   how much of what happens the machine tells you, not how many
                                   #   characters per utterance. At max the mid-turn narrator carries
                                   #   that, so the bookends shrink. Measured on the films: the
                                   #   longest line in three of them is four short statuses,
                                   #   ~135 characters.
                                   #   A CEILING, not a quota — one fact still means one sentence,
                                   #   which is the safety property: given room and nothing to fill
                                   #   it with, a model pads, and padding is one step from inventing.
                                   #   Bad news drops the softener at every level. Cost at 100
                                   #   turns/day × 22 days on elevenlabs: terse ~$48/mo · balanced
                                   #   ~$76 · chatty ~$105 · max ~$135 typical (extrapolated, not
                                   #   measured: ~$75 of ack + closing line now that both shrank, plus
                                   #   ~$60 of narration — a handful of conclusions a turn, most
                                   #   blocks refused, against the ~$135 of TTS the per-step version
                                   #   spent). `insight` also pays a cheap-model call per substantive
                                   #   block, which is cents a month, not dollars. `narrate: false`
                                   #   removes the channel; `narrate_max_per_turn` puts a hard ceiling
                                   #   back on a turn.
                                   #   `aiworks voice audition "<a request>"` speaks all four.
                                   #   ROOT CHECKOUT ONLY: a linked worktree is clamped to terse
                                   #   whatever this says. It has to be — layer 2 of the config
                                   #   chain reads <main clone>/workspace.config.local.yaml (a
                                   #   git-ignored file does not travel into a worktree), so a
                                   #   worktree INHERITS max rather than falling back to terse;
                                   #   that session is usually the unwatched one (a background
                                   #   dev-cycle, a slack-dispatch job); and both checkouts share
                                   #   one spool and one pair of speakers, so two max sessions
                                   #   queue instead of taking turns. Enforced in
                                   #   voice_chattiness (scripts/voice/lib.sh), so the step
                                   #   narrator goes quiet there too — it gates on `== max`.
  # A voice note attached to the Slack messages the workflow already sends. `aiworks voice mute`
  # deliberately does NOT reach it: that audio is a deliverable for the team — rendered on one
  # machine, heard on someone else's phone — so it is a standing decision made HERE, not a side
  # effect of one person's speakers being quiet for a call.
  notify_voice:
    enabled: false
  push_to_talk:
    enabled: false
    hotkey: "left_cmd+right_cmd"   # Both ⌘ keys — left and right are separate keycodes, so a
                                   #   side-specific chord collides with nothing, and the two
                                   #   together do nothing on their own. `fn+…` works ONLY on a
                                   #   built-in Apple keyboard: an external keyboard's fn is handled
                                   #   in its own firmware and never reaches macOS (measured).
    mic: default                   # `default` follows System Settings → Sound → Input, so plugging
                                   #   in a headset moves dictation with it. A device NAME pins it.
                                   #   An avfoundation INDEX is never accepted — the numbering
                                   #   changes with whatever is plugged in, and a wrong index
                                   #   records the wrong room.
    preview:
      provider: elevenlabs         # none | elevenlabs | openai — live transcript in the HUD
      window_seconds: 12           # the HUD re-transcribes only the last N seconds. Re-sending the
                                   #   whole prefix made the lag GROW with the utterance (0.98 s at
                                   #   2 s of audio, 1.86 s at 10 s); a trailing window keeps it flat
                                   #   at ~1.5 s. The text that gets TYPED is always the accurate
                                   #   pass over the COMPLETE recording, so nothing is lost.
    auto_send: true                # forced false when preview.provider is none
  cache:
    max_mb: 500                    # the synthesized-audio cache (LRU by access time). The key is
                                   #   provider|voice|model|cue|mix|text, so a repeated line is free.

# ── stagehand: put what the assistant touches ON SCREEN ────────────────────────
# Every tool call also shows its subject — an edited file in the editor, a fetched URL in a
# browser tab — placed in whatever screen space is actually free, on whatever display, WITHOUT
# taking the keyboard. Personal and off by default: it moves windows on one specific desk, so
# like `voice` it belongs in the git-ignored workspace.config.local.yaml. Full doc:
# docs/agents/stagehand.md.
#
# NOT built on Claude Code's `computer-use` MCP server, and the reasons are worth knowing before
# anyone tries to "upgrade" it: computer-use HIDES every other visible app while it works, holds a
# machine-wide lock until the session exits, is view-only for browsers and click-only for IDEs
# (so it cannot be told to open a URL or a file — the two things wanted here), screenshots into
# the model on every action, and requires Pro/Max — it is not offered on Team/Enterprise.
# stagehand is plain `open` + the editor CLI + Accessibility placement: no lock, no hiding, no
# screenshots, no plan tier.
stagehand:
  enabled: false                   # OFF for the team as shipped. Turn it on per PERSON in
                                   #   workspace.config.local.yaml, never here.
  placement: halves                # halves (default) | score | rectangle | off.
                                   #   halves    → HALF a display, split along its long edge, on a
                                   #               randomly chosen display: a landscape screen splits
                                   #               left/right, a portrait screen top/bottom. Half a
                                   #               screen is a shape you can actually read, which is
                                   #               why this replaced `score` as the default — see below.
                                   #               A role that already owns a half KEEPS it, so a
                                   #               window never hops when a tab opens; randomness only
                                   #               decides where each role goes the first time.
                                   #   score     → the original placer: score a grid of nine slots per
                                   #               display by how much each would overlap the windows
                                   #               already there, take the cheapest. Its arithmetic was
                                   #               fine and its OUTPUT SHAPES were not — on a desk where
                                   #               every display is already covered, the cheapest slot
                                   #               is whatever odd corner is least covered, so a browser
                                   #               landed in a 1280x705 bottom-left quadrant of a 5K
                                   #               display. Kept for anyone who prefers it.
                                   #   rectangle → drive Rectangle's URL scheme instead. Honours
                                   #               your Rectangle grid exactly, but its
                                   #               execute-action takes no app-bundle-id, so the
                                   #               target has to be focused first — it takes the
                                   #               keyboard mid-turn and hands it back.
                                   #   off       → open things, move nothing.
  displays: external               # external (default) | all — which displays stagehand may use.
                                   #   The BUILT-IN laptop screen is reserved by default: that is where
                                   #   a person keeps what THEY are using (chat, whatever is open), so
                                   #   stagehand stays on the external monitors. Detected mechanically
                                   #   with CGDisplayIsBuiltin against each screen's NSScreenNumber —
                                   #   never by display NAME, which would break on the next machine.
                                   #   Reserved is not banned: a laptop with no external display has
                                   #   only that screen, and a feature that refused to place anything
                                   #   there would simply be dead, so the built-in is the last-resort
                                   #   tier. `all` drops the reservation.
  protected_half: left             # left | right | top | bottom | off — the half the PROTECTED window
                                   #   (protect_process, i.e. your terminal) is shrunk to when it fills
                                   #   an entire external display. A terminal maximized across a 5K
                                   #   screen means that display can only ever be covered, never shared,
                                   #   so the biggest monitor on the desk drops out of the pool; giving
                                   #   up one side turns it into two usable halves and the terminal
                                   #   keeps a half still larger than most laptop screens. Only fires at
                                   #   >=90% coverage, NEVER on a window in native macOS fullscreen
                                   #   (its own Space, not usefully resizable — AXFullScreen is checked),
                                   #   and never on the reserved built-in display. `off` never resizes
                                   #   anything of yours.
  rectangle_action: right-half     # `placement: rectangle` only — any Rectangle action name.
  editor: cursor                   # the editor CLI (must accept `--goto file:line`)
  editor_process: Cursor           # its Accessibility process name, for placement. Cursor exposes
                                   #   NO AppleScript dictionary (`count windows` → error -1708),
                                   #   so its windows are only reachable by process name via
                                   #   System Events. Renaming the app breaks placement, not opening.
  browser: chrome                  # currently chrome only — the tab ring below is Chrome AppleScript
  browser_process: Google Chrome   # its Accessibility process name
  browser_account: ""              # WHICH ACCOUNT the tabs open under — your work email. This is a
                                   #   correctness setting, not a preference: Chrome's `make new
                                   #   window` inherits the LAST-USED profile, so a Jira or GitLab
                                   #   URL opened while your personal profile was last active renders
                                   #   a login wall instead of the ticket. Set it per person in
                                   #   workspace.config.local.yaml. Resolved to a profile directory
                                   #   through Chrome's own `Local State` metadata (no tokens read),
                                   #   because the directory names are creation-order and mean
                                   #   nothing portable — a machine can easily have the WORK account
                                   #   in "Default" and a personal one in "Profile 1".
  browser_profile: ""              # escape hatch: a raw profile DIRECTORY ("Default", "Profile 1"),
                                   #   used only when browser_account is unset or unresolvable.
  protect_process: iTerm2          # the window that must NEVER be covered — your terminal. Normally
                                   #   whatever had the keyboard is protected automatically; this is
                                   #   the fallback for when the app being placed IS the focused one
                                   #   (a browser tab opening while you were reading a browser tab),
                                   #   where protecting it would penalise its own display and push
                                   #   the new window somewhere worse.
  max_tabs: 8                   # the tab ring in stagehand's OWN window: past this the oldest
                                   #   tab closes. Your own windows are never touched.
  follow_max: 3                    # how many subjects one REPLY may put on screen. A reply listing
                                   #   22 stale MRs must not open 22 tabs; the first few in reading
                                   #   order are the headline, which is the right priority signal.
  interact: true                   # after opening, WORK INSIDE the window instead of going static.
                                   #   A focus phrase on a target (`SHOW: agent-db!555 ~signature_key`)
                                   #   becomes a URL text fragment, which Chrome itself scrolls to and
                                   #   highlights — no permission needed, and the default path. Where
                                   #   that falls short is single-page apps: Jira and GitLab paint
                                   #   their content AFTER navigation, and a text fragment resolves
                                   #   against the first paint, so the phrase often is not in the DOM
                                   #   yet. This key also allows the fallback of asking the rendered
                                   #   page to scroll and flash the phrase itself, which needs Chrome's
                                   #   View > Developer > "Allow JavaScript from Apple Events".
                                   #   ⚠️ That Chrome setting is OFF by default and is a real security
                                   #   boundary — with it on, ANY AppleScript on the machine can run
                                   #   JavaScript in any of your logged-in tabs. stagehand NEVER turns
                                   #   it on; it probes, caches the answer, and quietly does without.
                                   #   In the editor a focus phrase is grepped for and becomes the
                                   #   --goto line, which needs nothing extra.
  debounce_seconds: 2              # per target. A multi-hunk refactor fires a dozen PostToolUse
                                   #   events on one file in a second; without this the window
                                   #   visibly jitters a dozen times.
  url_hosts: "atlassian.net gitlab.com github.com slack.com signoz sonar figma.com mermaid.live localhost 127.0.0.1"
                                   #   SECURITY BOUNDARY, not tidiness. A URL sniffed out of a tool
                                   #   RESPONSE is a string from a file, a web page or a remote API,
                                   #   i.e. attacker-influenceable: auto-opening it would turn an
                                   #   injected link into a drive-by navigation on your logged-in
                                   #   browser profile. Response URLs must match one of these
                                   #   substrings; a WebFetch/WebSearch URL the model asked for
                                   #   explicitly bypasses the list.
  triggers:
    code: true                     # Write / Edit / NotebookEdit → editor at the edited line
    browser: true                  # WebFetch / WebSearch / allowlisted response URLs → browser tab
    narration: true                # the Stop hook: show what the REPLY talked about, not only what a
                                   #   tool touched. A turn's real subjects are often things the
                                   #   assistant merely explained — a stale MR, a ticket spanning
                                   #   three repos, a file. An explicit `SHOW: <target>` line in the
                                   #   reply is exact and free; with no tag the prose is scanned in
                                   #   reading order. Targets: a URL, `<repo>!<iid>` (resolved from
                                   #   that repo's git remote — never assembled by hand, which is how
                                   #   a 404 got produced), a ticket key, or a repo-relative path.
                                   #   Read / Grep / Glob are deliberately NOT triggers: a turn
                                   #   skims dozens of files, and mirroring those flips windows
                                   #   faster than anyone can follow and buries the edit that mattered.

# ── Deployed-env triage MCPs (read-only pg_triage + redis_triage) ──────────────
# Whether THIS machine carries the read-only triage MCP servers, reconciled by `aiworks sync`
# via scripts/triage-mcp.sh. Both keys are read LOCAL-FIRST. See docs/adr/0005.
triage:
  enabled: true                    # register both servers (LOCAL scope). ON by default: STAGING
                                   #   triage needs no authorization, so making everyone flip a flag
                                   #   before they can look at staging is friction with no payer.
                                   #   false → keep both out of every session on this machine.
  prod: false                      # the PRODUCTION opt-in, per PERSON (default OFF) — enforced
                                   #   INSIDE the servers (scripts/lib/triage_policy.py), so an
                                   #   env="prod" call is refused until it is true even on a machine
                                   #   that HAS the prod DSNs. Set it in the git-ignored
                                   #   workspace.config.local.yaml, which wins over this file.

# ── Products & repos — THE PART EACH ORG CONFIGURES ────────────────────────────
# A product groups the repos that ship together. Each product is ONE
# mani.d/<id>.yaml file (GENERATED from this block by `aiworks` — don't hand-edit
# mani.d). For each repo you only need a `url` (+ `kind`); aiworks derives the rest:
#
#   id / path  ← the repo NAME from the URL (last path segment, minus .git).  Override
#                the clone dir with `path:`.
#   desc       → a one-line repo responsibility — what this repo IS and owns, so the team (and
#                the agents) can read the workspace's anatomy BEFORE anything is cloned. Optional
#                but recommended. Flows verbatim into the generated mani.d/<product>.yaml `desc:`
#                (what `mani list projects` shows). Omitted → defaults to "The <repo-name> repo.".
#                (`description:` is accepted as an alias.)
#   app_id     → MOBILE APP REPOS ONLY — the application / bundle id of the app this repo builds
#                (Android applicationId / iOS bundle identifier, e.g. com.acme.app). The QA /
#                automation skills read it from here as the app-under-test id, and the test-suite repo's
#                config/capabilities.js should match it. Omit for non-mobile repos.
#   kind       → a FREE-FORM, tech-agnostic dev-context LABEL (frontend, backend, web-app,
#                service, migration, generic, …) — the tech goes in `lang`, NOT the kind.
#                It selects one of two role/gate ARCHETYPES:
#                  test-suite   → qa-runner builds the test suite (E2E / API / load), no code
#                                 review, provides the cross-repo test-suite (QA) gate. The ONE
#                                 special kind name.
#                  <any other>  → a code repo: developer builds (TDD), code-reviewer reviews,
#                                 guard+perf gates on (tune per repo via green / guardian_focus)
#
# After editing this block run `scripts/aiworks sync` to clone + onboard. That (like `add` /
# `remove`) also REGENERATES the dev-cycle.js CONFIG `REPOS` block from this file — the workflow
# can't read the FS at runtime, so `scripts/aiworks config` keeps its mirror in sync for you.
products:
  - id: <product-id>                          # → mani.d/<product-id>.yaml
    repos:
      - url: git@github.com:your-org/your-app.git   # ← all you must provide
        kind: frontend                              # any dev-context label; test-suite = QA archetype
        desc: The mobile app — offline-first, UI only.   # one-line repo responsibility (anatomy at a glance)
        lang: dart                                  # the TECH lives here; else auto-detected from the clone
        app_id: com.example.app                     # mobile apps only — the app/bundle id the QA suite drives (matches config/capabilities.js)
        distribute: firebase                        # firebase | none | custom  (default: none)
        # auto_merge: false                         # optional — override vcs.auto_merge for this repo
        # path: your-app                            # optional — clone dir (default: the repo name)
        # green: "<keep-it-green check, e.g. lint + unit tests>"   # optional override (else from kind)
        # guardian_focus: "<secrets, data-protection, perms…>"     # optional override (else from kind)
      - url: git@github.com:your-org/your-tests.git
        kind: test-suite                            # the cross-repo QA suite (E2E / API / load)
        desc: Android/iOS E2E UI tests for the app.      # one-line repo responsibility
        # suite_kind: load                          # optional. Which FLAVOUR of test-suite this is.
                                                    #   Omitted (the default) → a plain pass/fail
                                                    #   suite: green is green.
                                                    #   load → the suite measures NUMBERS, so green
                                                    #   is not enough: every tracked metric must
                                                    #   also be equal-or-better than the same run on
                                                    #   the ticket's base branch. Arms the
                                                    #   non-degradation gate and the loadtest.*
                                                    #   block above. docs/agents/loadtest-gate.md

# Repo dependency edges (build/merge order) are decided per-ticket by the scoping
# stage; a typical chain is backend → app → test-suite. When a ticket needs end-to-end
# validation the scoping stage pulls the test-suite repo INTO scope (last, depends_on the
# app/service repos) — that is what makes the cross-repo test-suite (QA) gate run. Flagging
# the gate without scoping that repo does nothing, so the dev-cycle backstops it by
# auto-adding the registered test-suite repo when the scope flags the gate but omits it.
